# Trading Bot v0.2 - indicator engine configuration.
#
# Periods are the only calculation parameters. They are never hardcoded in
# engine.py. Column names are derived from these values (ema20, ema50, …).

indicators:
  ema_fast: 20
  ema_slow: 50
  rsi_period: 14
  volume_ma_period: 20

# Derived Parquet overlay. The v0.1 processed store is never overwritten.
# Path is resolved relative to the project root.
enriched_dir: data/enriched
